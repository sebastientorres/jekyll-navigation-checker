version: 2.1
jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.4
    environment:
      BUNDLE_PATH = ~/repo/vendor/bundle
    steps:
      - checkout
      - run:
          name: Test
          command: rake
  deploy:
    docker:
      - image: cimg/ruby:3.3.4
    steps:
      - checkout
      - run:
          name: Build
          command: gem build jekyll-navigation-checker.gemspec
      - run:
          name: Publish
          command: gem push jekyll-navigation-checker-*.gem
workflows:
  build-deploy:
    jobs:
      - build:
          name: build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main